<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
<defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05281A"/>
      <stop offset="0.48" stop-color="#003F24"/>
      <stop offset="1" stop-color="#001D12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C5E38" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#031C12" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="limeButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4FA83"/>
      <stop offset="0.42" stop-color="#B9E54A"/>
      <stop offset="1" stop-color="#78B72B"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#AADB4A" stop-opacity="0.25"/><stop offset="1" stop-color="#AADB4A" stop-opacity="0"/></radialGradient>
    <pattern id="pattern" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <path d="M0 0 V54" stroke="#AAD84A" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.52"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

    <defs><clipPath id="cardClip"><rect x="48" y="38" width="928" height="1460" rx="54"/></clipPath></defs>
    <rect x="48" y="38" width="928" height="1460" rx="54" fill="url(#card)" stroke="#AAD84A" stroke-width="5"/>
    <rect x="57" y="47" width="910" height="1442" rx="45" fill="url(#pattern)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <ellipse cx="737.28" cy="476.15999999999997" rx="250" ry="250" fill="url(#halo)" clip-path="url(#cardClip)"/>
    <rect x="120" y="930" width="784" height="176" rx="30" fill="url(#glass)" stroke="#AAD84A" stroke-width="4"/>
    <path d="M155 950 H869" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
    <rect x="170" y="1160" width="684" height="116" rx="58" fill="url(#limeButton)" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)"/>
    <rect x="120" y="1324" width="784" height="120" rx="24" fill="#00150D" fill-opacity="0.78" stroke="#AAD84A" stroke-opacity="0.55" stroke-width="2"/>
  
</svg>
